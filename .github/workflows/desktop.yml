name: Desktop packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package-and-smoke:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm run lint
      - run: npm exec -w @argon/backend -- vitest run test/file-completion.test.ts test/server.test.ts
      - name: Check actool (Icon Composer icon needs Xcode 26+)
        if: runner.os == 'macOS'
        run: xcrun actool --version
      - run: npm run dist -w @argon/desktop -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run smoke:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: argon-${{ matrix.platform }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
          if-no-files-found: error
