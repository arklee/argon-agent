name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check tag matches desktop version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("packages/desktop/package.json", "utf8"));
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version) || tag !== `v${version}`) {
              throw new Error(`Tag ${tag} must match desktop version v${version}`);
            }
          '

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  packages:
    needs: checks
    uses: ./.github/workflows/desktop.yml

  publish:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: argon-*
          path: artifacts
          merge-multiple: true
      - name: Publish release with installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" artifacts/*.exe artifacts/*.dmg \
            --verify-tag --title "$TAG" --generate-notes "${options[@]}"
